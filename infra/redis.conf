# PassiveShield AI — Redis v7+ Service Configuration

# Network & Security
bind 0.0.0.0
protected-mode yes

# Memory Management & Bounded State Enforcement
# Maximum memory limit (e.g. 512MB for local dev/container)
maxmemory 512mb

# Eviction Policy: Evict least recently used keys with an explicit EXPIRE set
maxmemory-policy volatile-lru

# Persistence (RDB Snapshots for minimal durability)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Lazy Freeing for High Throughput Performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Advanced Tuning
hash-max-listpack-entries 512
hash-max-listpack-value 64
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
