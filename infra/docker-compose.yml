name: passiveshield-ai

services:
  # 1. Redpanda (Streaming Event Bus)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: passiveshield-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --advertise-schema-registry-addr
      - internal://redpanda:8081,external://localhost:18081
      - --mode
      - dev-container
      - --smp
      - '1'
      - --memory
      - 1G
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
      - "19092:19092"
      - "${REDPANDA_PANDAPROXY_PORT:-8082}:8082"
      - "${REDPANDA_SCHEMA_REGISTRY_PORT:-8081}:8081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - passiveshield-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Redpanda Console (Streaming Bus UI/Monitoring)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: passiveshield-redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console --config.filepath=/tmp/config.yml'
    environment:
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - passiveshield-net

  # 3. Redis (Bounded State Store)
  redis:
    image: redis:7-alpine
    container_name: passiveshield-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_secret} --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - passiveshield-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. PostgreSQL (Primary Persistence Store)
  postgres:
    image: postgres:16-alpine
    container_name: passiveshield-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passiveshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passiveshield_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-passiveshield_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - passiveshield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passiveshield} -d ${POSTGRES_DB:-passiveshield_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. API Backend Service Placeholder
  api-service:
    image: alpine:latest
    container_name: passiveshield-api-placeholder
    command: /bin/sh -c "echo 'PassiveShield API Placeholder Service Started' && tail -f /dev/null"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - passiveshield-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'API service placeholder healthy' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  passiveshield-net:
    driver: bridge
    name: passiveshield-net

volumes:
  redpanda-data:
    name: passiveshield-redpanda-data
  redis-data:
    name: passiveshield-redis-data
  postgres-data:
    name: passiveshield-postgres-data
